name: Deploy to Cloud Composer

on:
  push:
    branches:
      - main  # Triggers when you push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          # You will replace these placeholders later
          workload_identity_provider: 'projects/YOUR_PROJECT_ID/locations/global/workloadIdentityPools/YOUR_POOL/providers/YOUR_PROVIDER'
          service_account: 'your-service-account@your-project.iam.gserviceaccount.com'

      - name: Sync DAGs to GCS
        run: |
          gsutil -m rsync -r ./dags gs://YOUR_COMPOSER_DAG_BUCKET/dags